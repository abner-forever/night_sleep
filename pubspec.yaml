name: night_sleep
description: 夜深：本地优先的睡眠记录应用。
publish_to: "none"
version: 0.49.0-beta.2+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.20.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  sqlite3_flutter_libs: ^0.5.24
  flutter_svg: ^2.3.0
  http: ^1.6.0
  crypto: ^3.0.7
  just_audio: ^0.10.6
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  # 下界锁 5.1.1：5.1.0 用 `apply plugin: 'kotlin-android'` 应用 KGP，会被 Flutter
  # 基于正则的插件静态检查认出来并报「Future versions of Flutter will fail to build」；
  # 5.1.1 改成 pluginManager.apply(...) 绕开该检测。别往回降。
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.0
  archive: ^4.0.7
  file_selector: ^1.1.0
  package_info_plus: ^10.2.1
  flutter_secure_storage: ^11.2.0
  record: ^7.1.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the app on a real device/simulator for the screenshot tour. Ships
  # with the SDK.
  integration_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  flutter_lints: ^4.0.0
  webview_flutter_platform_interface: ^2.15.1

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    # 助眠音效的五条循环素材。由 tool/generate_noise_assets.dart 生成，
    # 源素材来自爱给网（aigei.com），**可商用授权尚未落实**——发布前必须确认或更换，
    # 见 docs/superpowers/specs/2026-10-03-noise-real-recordings-design.md §3.1。
    - assets/noise/
    # 鼾声/人声判定的模型（YAMNet，MediaPipe 那份 TFLite 转换件，4,126,810 字节）。
    # **它进仓库**：判定在端侧跑，文件必须在包里。
    # ⚠️ **它的许可证官方至今没有正面声明**（模型文件内嵌元数据写的是 Apache-2.0，
    # 上游 YAMNet 权重也是 Apache-2.0，但 MediaPipe 的文档没写这一条）——
    # 与「助眠音效素材的可商用授权」同一类**发布阻塞项**，见 README「未实现」表。
    - assets/model/
