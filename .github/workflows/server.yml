name: 服务端 · PM2 部署

# beta 分支部署测试服（server-beta），main 分支部署正式服（server-prod）。
# 服务器信息与私钥按 Environment 分开配置，同一套工作流可对应一台或两台服务器。
on:
  push:
    branches: [beta, main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 部署目标
        required: true
        type: choice
        options: [beta, prod]
        default: beta

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      environment: ${{ steps.resolve.outputs.environment }}
      default_path: ${{ steps.resolve.outputs.default_path }}
      default_port: ${{ steps.resolve.outputs.default_port }}
    steps:
      - name: 解析部署目标
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            target="$INPUT_ENV"
          else
            case "$REF_NAME" in
              beta) target=beta ;;
              main) target=prod ;;
              *) echo "分支 $REF_NAME 不参与部署" >&2; exit 1 ;;
            esac
          fi
          case "$target" in
            beta) default_port=8081 ;;
            prod) default_port=8080 ;;
            *) echo "未知部署目标：$target" >&2; exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "environment=server-$target" >> "$GITHUB_OUTPUT"
          echo "default_path=/var/www/night-sleep/$target" >> "$GITHUB_OUTPUT"
          echo "default_port=$default_port" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.prepare.outputs.environment }}
    concurrency:
      group: server-deploy-${{ needs.prepare.outputs.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ needs.prepare.outputs.target }}
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      # 不配置时使用默认值：/var/www/night-sleep/<beta|prod>、8081/8080。
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || needs.prepare.outputs.default_path }}
      APP_PORT: ${{ vars.APP_PORT || needs.prepare.outputs.default_port }}
      NPM_REGISTRY: ${{ vars.NPM_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖并校验
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: 检查部署配置
        run: |
          set -euo pipefail
          missing=0
          for name in SERVER_HOST SERVER_USER; do
            if [ -z "${!name}" ]; then
              echo "缺少环境变量 $name，请在 Environment「${{ needs.prepare.outputs.environment }}」中配置。" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: 配置 SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_SSH_KEY" ]; then
            echo "缺少 Secret SERVER_SSH_KEY（服务器私钥）。" >&2
            exit 1
          fi
          mkdir -p ~/.ssh

          # Secret 里常见的粘贴事故，都会让 OpenSSH 报 “Load key ...: error in libcrypto”：
          #   1) 换行被存成字面量 \n / \r；2) CRLF 行尾；3) 整段被 base64 包了一层；
          #   4) BEGIN 行和 base64 正文粘在一起（少了一个换行，PEM 解析器只认独占一行的头）。
          # 前三种先归一化；最后一种直接按“取正文 → 去空白 → 重新折行”重建，与原始格式无关。
          key=${SERVER_SSH_KEY//\\r/}
          key=${key//\\n/$'\n'}
          key=${key//$'\r'/}
          if [[ "$key" != *"PRIVATE KEY"* ]]; then
            if decoded=$(printf '%s' "$key" | base64 -d 2>/dev/null) \
              && [[ "$decoded" == *"PRIVATE KEY"* ]]; then
              key=$decoded
              echo "Secret 是 base64 包装的，已自动解码。"
            fi
          fi
          if [[ "$key" =~ -----BEGIN[[:space:]]([[:alpha:][:digit:] ]+)-----(.*)-----END[[:space:]]([[:alpha:][:digit:] ]+)----- ]]; then
            kind=${BASH_REMATCH[1]}
            # base64 正文里不会有空白，整体去掉后按 64 列重新折行即可。
            body=${BASH_REMATCH[2]//[[:space:]]/}
            body=$(printf '%s' "$body" | fold -w 64)
            printf '%s\n' "-----BEGIN $kind-----" "$body" "-----END $kind-----" \
              > ~/.ssh/id_deploy
          else
            echo "Secret 里找不到完整的「-----BEGIN …-----」到「-----END …-----」。" >&2
            echo "看起来贴成了公钥、只贴了一行，或内容被截断。" >&2
            exit 1
          fi
          chmod 600 ~/.ssh/id_deploy

          # 诊断：只打印结构，不打印密钥正文（GitHub 也会把 Secret 值打码）。
          echo "整理后：$(wc -c < ~/.ssh/id_deploy) 字节，$(wc -l < ~/.ssh/id_deploy) 行，类型 $kind"
          echo "首行：$(head -n 1 ~/.ssh/id_deploy | cut -c1-64)"
          echo "末行：$(tail -n 1 ~/.ssh/id_deploy | cut -c1-64)"

          if ! ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null; then
            echo "私钥无法解析：内容被截断、格式不对，或是带口令的加密私钥（CI 里没法输入口令）。" >&2
            echo "请在服务器上重新生成密钥（不要加口令），把私钥完整内容贴进 Secret。" >&2
            exit 1
          fi
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: 备份上一版本并上传构建产物
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          SSH_OPTS=(-p "$SERVER_PORT" -i ~/.ssh/id_deploy -o IdentitiesOnly=yes)
          ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$DEPLOY_PATH' && cd '$DEPLOY_PATH' && if [ -d dist ]; then rm -rf dist.prev && mv dist dist.prev; fi"
          # -R（--relative）：不带它 rsync 只取每个源文件的 basename，
          # deploy/remote-deploy.sh 会变成部署目录下的 remote-deploy.sh。
          rsync -azR \
            -e "ssh -p $SERVER_PORT -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            dist package.json package-lock.json ecosystem.config.cjs .env.example deploy/remote-deploy.sh deploy/rollback.sh \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"
          # 印一份远端目录内容，上传漏了哪一项一眼就能看出来。
          ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && ls -la && echo '--- deploy/ ---' && ls -la deploy"

      - name: 远端安装、重启并健康检查
        env:
          APP_ENV: ${{ needs.prepare.outputs.target }}
        run: |
          set -euo pipefail
          ssh -p "$SERVER_PORT" -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" "
              cd '$DEPLOY_PATH' || exit 1
              if [ ! -f deploy/remote-deploy.sh ]; then
                echo '远端 $DEPLOY_PATH 里没有 deploy/remote-deploy.sh，上一步 rsync 没传到位。' >&2
                ls -la >&2
                exit 1
              fi
              chmod +x deploy/remote-deploy.sh deploy/rollback.sh
              APP_ENV='$APP_ENV' PORT='$APP_PORT' NPM_REGISTRY='$NPM_REGISTRY' bash deploy/remote-deploy.sh
            "
