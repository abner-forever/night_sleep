name: Android · 自动发布

on:
  push:
    branches: [beta, main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.*'
      - 'tool/*android_release.py'
      - 'tool/configure_android_signing.py'
      - 'tool/test_configure_android_signing.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 验证发布规则并分配版本
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          python3 -m unittest discover -s tool -p 'test_*release.py'
          python3 -m unittest discover -s tool -p 'test_*signing.py'
          case "$RELEASE_BRANCH" in beta|main) ;; *) echo '只能从 beta 或 main 发布' >&2; exit 1 ;; esac
          git fetch origin "$RELEASE_BRANCH"
          if [ "$GITHUB_SHA" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '分支已有更新的提交，本次跳过，等待最新提交发布。'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tool/plan_android_release.py plan \
            --repository "$GITHUB_REPOSITORY" --branch "$RELEASE_BRANCH" \
            --source-sha "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  apk:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m" -Dorg.gradle.workers.max=2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 写入本次构建版本（仅 CI 工作目录）
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: python3 tool/plan_android_release.py apply --version "$RELEASE_VERSION" --build-number "$BUILD_NUMBER"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 恢复项目长期签名（缺失时终止 release 构建）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/configure_android_signing.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 安装项目所需 Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: 解析依赖并生成 Drift 代码
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
      - name: 静态检查和测试
        run: |
          flutter analyze
          flutter test
      - name: 构建 Android release APK（项目长期签名，关闭演示数据）
        # 测试会生成包含 integration_test 的插件注册；release 构建需重新生成，
        # 不能使用 --no-pub，否则会保留测试注册而缺少对应的 release 插件。
        run: >-
          flutter build apk --release
          --dart-define=DEMO_DATA=false
          --dart-define=WEATHER_API_BASE_URL=${{ vars.WEATHER_API_BASE_URL }}
      - name: 检查安装包与签名并生成校验文件
        shell: bash
        run: |
          python3 tool/android_release.py package \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --source-sha "$GITHUB_SHA" --branch "$GITHUB_REF_NAME"
          cat artifacts/android/package-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30
      - name: 清理工作目录中的签名私钥
        if: always()
        run: python3 tool/configure_android_signing.py --clean

  publish:
    needs: [prepare, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 发布说明要列出上一版本以来的提交，必须是完整历史（默认只取 1 层）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: artifacts/android
      - name: 发布已核验的版本（Beta 标记为 Pre-release）
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          (cd artifacts/android && sha256sum --check SHA256SUMS.txt)
          python3 tool/plan_android_release.py publish --repository "$GITHUB_REPOSITORY"
          echo "### Android 发布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
