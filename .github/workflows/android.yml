name: Android · APK 版本构建

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.*'
      - 'tool/*android_release.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m" -Dorg.gradle.workers.max=2'
    steps:
      - uses: actions/checkout@v4
      - name: 解析版本并检查打包规则
        id: version
        run: |
          python3 -m unittest discover -s tool -p 'test_android_release.py'
          python3 tool/android_release.py version --github-output "$GITHUB_OUTPUT"
      - name: 确认发布标签与包内版本一致
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.tag }}
        run: test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 安装项目所需 Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: 解析依赖并生成 Drift 代码
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
      - name: 静态检查和测试
        run: |
          flutter analyze
          flutter test
      - name: 构建 Android release APK（测试签名，关闭演示数据）
        # 测试会生成包含 integration_test 的插件注册；release 构建需重新生成，
        # 不能使用 --no-pub，否则会保留测试注册而缺少对应的 release 插件。
        run: flutter build apk --release --dart-define=DEMO_DATA=false
      - name: 检查安装包与签名并生成校验文件
        shell: bash
        run: |
          python3 tool/android_release.py package \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          cat artifacts/android/package-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.artifact_name }}
          path: artifacts/android
      - name: 发布已核验的版本（Beta 标记为 Pre-release）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.apk.outputs.tag }}
          RELEASE_VERSION: ${{ needs.apk.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.apk.outputs.channel }}
        shell: bash
        run: |
          cd artifacts/android
          sha256sum --check SHA256SUMS.txt
          # 草稿上传完毕后再公开，官网不会读取到未完成的附件；已有版本禁止覆盖。
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '该版本已存在，请递增 pubspec 版本与构建号后发布。' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "夜深 Android $RELEASE_VERSION" --notes-file README.txt
          gh release upload "$RELEASE_TAG" ./*
          if [ "$RELEASE_CHANNEL" = beta ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
