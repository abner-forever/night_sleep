org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 下面两条是本机的构建绕行，不是工程本身的配置。本机 pub 缓存在 C:、工程在 D:，而 Kotlin
# 增量编译缓存存的是源码根的绝对路径，跨盘建不出公共根，于是每个 Kotlin 插件都在关缓存时抛
# AssertionError（Could not close incremental caches … different roots），构建以 6 failures
# 结束。关掉增量编译即可绕过。
kotlin.incremental=false
# 编译器改在 Gradle 进程内跑，不另起 Kotlin 守护进程——本机经代理拉 kotlin-compiler-runner
# 会静默挂住（不报错、日志不动）。两条合起来是本机实测通过的组合；单盘、直连的机器上可以
# 把这一段整体删掉。
kotlin.compiler.execution.strategy=in-process

# **这一条是被 tflite_flutter 逼出来的，不是工程本身要的**（2026-10-16 加，端侧测量用）。
# 它的 Android 模块把自己的 Java 目标写死 11，而 Flutter 给插件模块的 Kotlin 目标默认 17，
# AGP 8 的一致性校验于是直接判错：`Execution failed for task ':tflite_flutter:compileDebugKotlin'`
# → `Inconsistent JVM-target compatibility … (11) and (17)`。降成 warning 只是不拦，
# **不改任何产出的字节码目标**（Java 11 与 Kotlin 17 的类在 ART 上都跑得动）。
# **只在依赖里还有 tflite_flutter 时需要**——那条路一旦不走了，这行跟着一起删。
kotlin.jvm.target.validation.mode=warning
